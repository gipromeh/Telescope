<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#10151b"><title>TELESCOPE — 12° Objective</title><style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#10151b;color:#e8edf2}#view{position:fixed;inset:0}canvas{width:100%;height:100%;display:block;touch-action:none}.panel{position:fixed;z-index:3;background:#0e141bf2;border:1px solid #34414e;border-radius:13px;padding:10px;backdrop-filter:blur(14px)}#top{top:env(safe-area-inset-top);left:8px;right:8px;display:flex;align-items:center;justify-content:space-between}h1{font-size:14px;margin:0}.sub{font-size:10px;color:#aab7c4;margin-top:3px}button{background:#202b36;color:#e8edf2;border:1px solid #3b4b5b;border-radius:9px;min-height:42px;padding:8px;font-size:11px;touch-action:manipulation}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}#controls{left:8px;right:8px;bottom:env(safe-area-inset-bottom)}#views{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}#actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}#parts{position:fixed;right:8px;top:70px;z-index:4}#drawer{display:none;left:8px;right:8px;bottom:180px;max-height:55dvh;overflow:auto}#drawer.open{display:block}.toggle{display:flex;align-items:center;gap:8px;min-height:38px;font-size:11px}.toggle input{width:18px;height:18px}#status{position:fixed;top:62px;left:10px;right:10px;text-align:center;font-size:10px;color:#e4bd78;pointer-events:none}#info{font-size:11px;line-height:1.45;margin-top:8px}@media(min-width:760px){#controls{width:270px;bottom:12px}#drawer{display:block;left:auto;right:12px;top:12px;bottom:12px;width:260px;max-height:none}#parts{display:none}#top{right:auto;width:430px;top:12px}#status{top:80px}}</style></head><body><div id="view"></div><header id="top" class="panel"><div><h1>TELESCOPE — 12-градусный объектив</h1><div class="sub">3D-модель · Механическая итерация 03</div></div></header><button id="parts">Детали</button><div id="status">Загрузка GLB…</div><section id="controls" class="panel"><div class="grid"><button id="modeA">Сборка</button><button id="modeB">Юстировка</button><button id="modeC">Разнесено</button><button id="modeD">Внутри</button></div><div id="views"><button data-v="front">Спереди</button><button data-v="rear">Сзади</button><button data-v="left">Слева</button><button data-v="right">Справа</button><button data-v="top">Сверху</button><button data-v="bottom">Снизу</button></div><div id="actions"><button id="fit">Вписать модель</button><button id="reset">Сбросить вид</button></div></section><aside id="drawer" class="panel"><div style="font-size:10px;color:#8fa2b5;margin-bottom:8px">ВИДИМОСТЬ КОМПОНЕНТОВ</div><div id="toggles"></div><div id="info">Выберите компонент модели.</div></aside><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const groups=['Front Aperture Assembly','Corrector Assembly','Rear Mangin Mirror Assembly','Longitudinal Titanium Lamellae','Rear Titanium Frame','Outer Protective Tube','Light-Shielding Cover','Camera Support Structure','Mounting Clamp','External Alignment Equipment'];const ru=['Передняя оправа и входные линзы','Блок корректора','Зеркало Манжена и чашка','Продольные титановые ламели','Задняя титановая оправа','Защитный тубус','Светозащитный кожух','Опора камеры','Крепёжный хомут','Внешняя юстировочная оснастка'];const root=document.querySelector('#view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x10151b);const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,10000);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;root.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(0,0,300);orbit.minDistance=80;scene.add(new THREE.HemisphereLight(0xdceaff,0x26313b,2.1));let l=new THREE.DirectionalLight(0xffffff,3);l.position.set(500,-500,900);scene.add(l);l=new THREE.DirectionalLight(0x8eb8dc,1.2);l.position.set(-500,400,100);scene.add(l);let model=null;const by=new Map(),pos=new Map();function vis(g,v){(by.get(g)||[]).forEach(o=>o.visible=v);const c=document.querySelector(`[data-group="${CSS.escape(g)}"]`);if(c)c.checked=v}function fit(){if(!model)return;const b=new THREE.Box3();model.traverse(o=>{if(o.isMesh&&o.visible)b.expandByObject(o)});const s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),d=Math.max(s.x,s.y,s.z);orbit.target.copy(c);camera.position.copy(c).add(new THREE.Vector3(d*1.35,-d*1.55,d*1.1));camera.near=.1;camera.far=d*30;camera.updateProjectionMatrix()}function mode(m){if(!model)return;document.querySelectorAll('.grid button').forEach(b=>b.style.background='');document.querySelector('#mode'+m).style.background='#33506a';model.traverse(o=>{if(o.isMesh){o.position.copy(pos.get(o.uuid)||o.position);o.visible=true}});document.querySelectorAll('[data-group]').forEach(c=>c.checked=true);if(m==='A')vis(groups[9],false);if(m==='B'){vis(groups[5],false);vis(groups[6],false)}if(m==='D')[5,6,8,9].forEach(i=>vis(groups[i],false));if(m==='C'){vis(groups[5],false);vis(groups[6],false);const off={0:[0,0,-115],1:[0,0,-220],7:[0,0,-315],2:[0,0,145],4:[0,0,235],8:[0,0,55],9:[0,0,360]};Object.entries(off).forEach(([i,v])=>(by.get(groups[i])||[]).forEach(o=>o.position.add(new THREE.Vector3(...v))))}}
new GLTFLoader().load('./model.glb',g=>{model=g.scene;scene.add(model);model.traverse(o=>{if(!o.isMesh)return;const n=o.name||'',k=n.split('::')[0];if(groups.includes(k)){if(!by.has(k))by.set(k,[]);by.get(k).push(o);pos.set(o.uuid,o.position.clone())}o.userData.group=k;o.userData.name=n.split('::').slice(1).join('::')||n});const t=document.querySelector('#toggles');groups.forEach((g,i)=>{const lab=document.createElement('label');lab.className='toggle';const c=document.createElement('input');c.type='checkbox';c.checked=true;c.dataset.group=g;c.onchange=()=>vis(g,c.checked);const span=document.createElement('span');span.textContent=ru[i];lab.append(c,span);t.append(lab)});mode('A');fit();document.querySelector('#status').textContent='Модель загружена · CONCEPT / FOR REVIEW'},undefined,e=>{document.querySelector('#status').textContent='Ошибка загрузки model.glb';console.error(e)});
['A','B','C','D'].forEach(m=>document.querySelector('#mode'+m).onclick=()=>mode(m));document.querySelector('#fit').onclick=fit;document.querySelector('#reset').onclick=()=>{mode('A');fit()};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(!model)return;const bb=new THREE.Box3();model.traverse(o=>{if(o.isMesh&&o.visible)bb.expandByObject(o)});const c=bb.getCenter(new THREE.Vector3()),d=bb.getSize(new THREE.Vector3()).length()*1.1;const v={front:[0,0,-1],rear:[0,0,1],left:[-1,0,0],right:[1,0,0],top:[0,1,0],bottom:[0,-1,0]}[b.dataset.v];camera.position.copy(c).add(new THREE.Vector3(...v).multiplyScalar(d));orbit.target.copy(c)});document.querySelector('#parts').onclick=()=>document.querySelector('#drawer').classList.toggle('open');const ray=new THREE.Raycaster(),p=new THREE.Vector2();renderer.domElement.addEventListener('click',e=>{if(!model)return;const r=renderer.domElement.getBoundingClientRect();p.x=(e.clientX-r.left)/r.width*2-1;p.y=-(e.clientY-r.top)/r.height*2+1;ray.setFromCamera(p,camera);const h=ray.intersectObject(model,true).find(x=>x.object.isMesh);if(h)document.querySelector('#info').textContent=(h.object.userData.name||h.object.name)+' — '+(ru[groups.indexOf(h.object.userData.group)]||'Компонент')});function draw(){requestAnimationFrame(draw);orbit.update();renderer.render(scene,camera)}draw();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
