name: YouGile MCP Test

on:
  workflow_dispatch:
    inputs:
      inspect_kb_pages:
        description: "Run the optional read-only kb_list_pages probe (response details are suppressed)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Diagnose YouGile MCP
        env:
          YOUGILE_MCP_URL: ${{ secrets.YOUGILE_MCP_URL }}
          YOUGILE_MCP_TOKEN: ${{ secrets.YOUGILE_MCP_TOKEN }}
          YOUGILE_MCP_INSPECT_KB: ${{ inputs.inspect_kb_pages }}
        run: node scripts/yougile-mcp-test.mjs
