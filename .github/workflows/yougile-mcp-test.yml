name: YouGile MCP Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diagnose YouGile MCP
        env:
          YOUGILE_MCP_URL: ${{ secrets.YOUGILE_MCP_URL }}
          YOUGILE_MCP_TOKEN: ${{ secrets.YOUGILE_MCP_TOKEN }}
        run: node scripts/yougile-mcp-test.mjs
